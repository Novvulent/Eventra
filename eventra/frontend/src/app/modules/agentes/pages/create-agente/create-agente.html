
<div class="ev-page">
  <app-page-header icon="bi-person-badge" [section]="section" title="Registrar agente"
                   subtitle="Completa la información para registrar un nuevo agente.">
    <app-back />
  </app-page-header>

  <div class="card">
    <div class="ev-card-header">
      <h2 class="ev-card-title"><i class="bi bi-person-badge"></i> Información del agente</h2>
    </div>
    <div class="card-body p-4">
      <app-form-agente [saving]="saving()" submitLabel="Registrar agente"
                         (save)="createAgente($event)" (cancel)="goToList()" />
    </div>
  </div>
</div>
