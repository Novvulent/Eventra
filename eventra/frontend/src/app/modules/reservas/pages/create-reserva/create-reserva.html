
<div class="ev-page">
  <app-page-header icon="bi-ticket-detailed" [section]="section" title="Registrar reserva"
                   subtitle="Completa la información para registrar una nueva reserva.">
    <app-back />
  </app-page-header>

  <div class="card">
    <div class="ev-card-header">
      <h2 class="ev-card-title"><i class="bi bi-ticket-detailed"></i> Información de la reserva</h2>
    </div>
    <div class="card-body p-4">
      <app-form-reserva [saving]="saving()" submitLabel="Registrar reserva"
                         (save)="createReserva($event)" (cancel)="goToList()" />
    </div>
  </div>
</div>
