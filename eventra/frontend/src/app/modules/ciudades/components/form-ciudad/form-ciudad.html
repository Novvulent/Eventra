
<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="row g-3">
  <div class="col-md-6">
    <label class="form-label" for="nombre">Nombre <span class="text-danger">*</span></label>
    <input id="nombre" type="text" class="form-control" formControlName="nombre" placeholder="Tuluá">
    @if (invalid('nombre')) { <small class="text-danger">Este campo es obligatorio.</small> }
  </div>
  <div class="col-md-6">

    <label class="form-label" for="id_departamento">Departamento <span class="text-danger">*</span></label>
    <select id="id_departamento" class="form-select" formControlName="id_departamento">
      <option [ngValue]="null">Seleccione...</option>
      @for (o of departamentos; track o.id_departamento) {
        <option [ngValue]="o.id_departamento">{{ o.nombre }}</option>
      }
    </select>
    @if (invalid('id_departamento')) { <small class="text-danger">Este campo es obligatorio.</small> }
  </div>
  </div>

  <hr class="my-4">

  <!-- Acciones -->=
    </button>
  </div>
</form>
