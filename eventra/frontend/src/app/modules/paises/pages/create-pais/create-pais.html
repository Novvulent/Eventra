
<div class="ev-page">
  <app-page-header icon="bi-globe-americas" [section]="section" title="Registrar país"
                   subtitle="Completa la información para registrar un nuevo país.">
    <app-back />
  </app-page-header>

  <div class="card">
    <div class="ev-card-header">
      <h2 class="ev-card-title"><i class="bi bi-globe-americas"></i> Información del país</h2>
    </div>
    <div class="card-body p-4">
      <app-form-pais [saving]="saving()" submitLabel="Registrar país"
                         (save)="createPais($event)" (cancel)="goToList()" />
    </div>
  </div>
</div>
